<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Categoria</title>
    <link rel="stylesheet" href="./categoria-produto.css">
    <link rel="stylesheet" href="/crud-global.css">
    <link rel="stylesheet" href="/alerta.css">
</head>

<body>
    <nav class="crud-topbar">
        <a href="/menu/cadastros">← Voltar à Central de Cadastros</a>
    </nav>

    <header>
        <h1>CRUD Categoria</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Categoria</h2>

            <form id="categoriaForm">
                <div class="search-container">
                    <label for="searchId">Buscar por ID:</label>

                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar" min="1">

                        <button type="button" id="btnBuscar">🔍 Buscar</button>
                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>

                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>

                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>

                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>

                        <button type="button" id="btnCancelar" class="btn-cancel">
                            Cancelar
                        </button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados da Categoria</legend>

                    <div class="form-group">
                        <label for="nome_categoria_produto">
                            Nome da categoria:
                        </label>

                        <input type="text" id="nome_categoria_produto" name="nome_categoria_produto" maxlength="60"
                            placeholder="Ex.: Bases, Batons, Corretivos..." required>
                    </div>
                </fieldset>
            </form>
        </section>
        <section class="list-section">
            <div class="table-container">
                <table id="categoriasTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome da categoria</th>
                        </tr>
                    </thead>
                    <tbody id="categoriasTableBody">
                        <!-- Categorias carregadas pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CRUD Categoria</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="/alerta.js"></script>
    <script src="./categoria-produto.js" defer></script>
</body>

</html>
