<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/login/login.css">
    <link rel="stylesheet" href="/alerta.css">
</head>

<body>

    <!-- Container Master centralizado -->
    <div class="master-container">

        <!-- Frame do email -->
        <div id="loginFrame" class="form-container">
            <h2>Login</h2>
            <label for="email">Digite seu email</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required />
            <button onclick="verificarEmail()">Avançar</button>
            <p class="link-cadastro">Não tem conta? <a href="/login/cadastro/cadastro.html">Cadastre-se</a></p>
        </div>

        <!-- Frame da senha -->
        <div id="senhaFrame" class="form-container" style="display:none;">
            <h2>Login</h2>
            <p id="nomeUsuario"></p>
            <label for="senha">Digite sua senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required />
            <button onclick="verificarSenha()">Entrar</button>
            <p class="link-login"><a href="/login/login.html">Voltar na Tela Anterior</a></p>  
            <p class="link-login"><a href="/login/esqueci-senha.html">Esqueceu sua senha?</a></p>
        </div>

        <!-- Mensagens dinâmicas -->
        <div class="message-container"></div>

    </div>

    <script src="/alerta.js"></script>
    <script src="/login/login.js"></script>
</body>

</html>
