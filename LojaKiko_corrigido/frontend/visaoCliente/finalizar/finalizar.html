
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conferir pedido | CandyShop</title>

    <link rel="stylesheet" href="/visaoCliente/finalizar/finalizar.css">
    <link rel="stylesheet" href="/alerta.css">
</head>

<body>

    <header>

        <div class="topo">
            <h1>CandyShop — Conferir pedido</h1>
        </div>

        <nav class="nav">

            <ul class="nav__menu">

                <li class="nav__menu-item">
                    <a href="/menu">Início</a>
                </li>

                <li class="nav__menu-item">
                    <a href="/menu#sobre">Sobre</a>
                </li>

                <li class="nav__menu-item">
                    <a href="/menu#contato">Contato</a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <table id="lista-finalizar">

            <thead>
                <tr>
                    <th>Código</th>
                    <th>Produto</th>
                    <th>Preço unitário</th>
                    <th>Quantidade</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody id="listaFinalizar"></tbody>

        </table>

        <h2 id="total-final"></h2>

        <div class="container-botoes">

            <button
                type="button"
                onclick="window.location.href='/login/visaoclientecarrinho'"
            >
                ← Voltar ao carrinho
            </button>

            <button
                type="button"
                id="btn-finalizar"
            >
                Ir para pagamento →
            </button>

        </div>

    </main>

    <script src="/alerta.js"></script>
    <script src="/visaoCliente/finalizar/finalizar.js"></script>

</body>
</html>
