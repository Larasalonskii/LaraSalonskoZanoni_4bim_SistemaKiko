
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD - Tom</title>

    <link rel="stylesheet" href="./tom.css">
    <link rel="stylesheet" href="/crud-global.css">
    <link rel="stylesheet" href="/alerta.css">
</head>

<body>

    <nav class="crud-topbar">
        <a href="/menu/cadastros">
            ← Voltar à Central de Cadastros
        </a>
    </nav>

    <header>
        <h1>CRUD Tom</h1>
    </header>

    <main>

        <section class="form-section">

            <h2>Cadastro de Tom</h2>

            <form id="tomForm">

                <div class="search-container">

                    <label for="searchId">Buscar por ID:</label>

                    <div class="search-input-group">

                        <input
                            type="number"
                            id="searchId"
                            placeholder="Digite o ID para buscar"
                            min="1"
                        >

                        <button type="button" id="btnBuscar">
                            🔍 Buscar
                        </button>

                        <button type="button" id="btnIncluir" class="btn-primary">
                            Incluir
                        </button>

                        <button type="button" id="btnAlterar"
                            class="btn-secondary" style="display:none">
                            Alterar
                        </button>

                        <button type="button" id="btnExcluir"
                            class="btn-danger" style="display:none">
                            Excluir
                        </button>

                        <button type="button" id="btnSalvar"
                            class="btn-save" style="display:none">
                            Salvar
                        </button>

                        <button type="button" id="btnCancelar"
                            class="btn-cancel">
                            Cancelar
                        </button>

                    </div>
                </div>

                <fieldset id="formFields">

                    <legend>Dados do Tom</legend>

                    <div class="tom-fields-grid">

                        <div class="form-group">

                            <label for="nome_tom">
                                Nome do tom:
                            </label>

                            <input
                                type="text"
                                id="nome_tom"
                                name="nome_tom"
                                maxlength="40"
                                placeholder="Ex.: Bege Claro"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="categoria_produto_id_categoria_produto">
                                Categoria:
                            </label>

                            <select
                                id="categoria_produto_id_categoria_produto"
                                name="categoria_produto_id_categoria_produto"
                                required
                            >
                                <option value="">
                                    Carregando categorias...
                                </option>
                            </select>

                        </div>

                        <div class="form-group tom-image-group">

                            <label for="imagem_tom">
                                Foto do tom:
                            </label>

                            <input
                                type="file"
                                id="imagem_tom"
                                name="imagem_tom"
                                accept="image/png,image/jpeg,image/webp"
                            >

                            <small>
                                PNG, JPG ou WEBP — máximo de 10 MB.
                            </small>

                            <img
                                id="previewTom"
                                class="tom-image-preview"
                                alt="Pré-visualização da foto do tom"
                            >

                        </div>

                    </div>

                </fieldset>

            </form>

        </section>

        <section class="list-section">

            <div class="table-container">

                <table id="tonsTable">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Foto</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                        </tr>
                    </thead>

                    <tbody id="tonsTableBody"></tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2025 CRUD Tom</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="/alerta.js"></script>
    <script src="./tom.js" defer></script>

</body>
</html>
